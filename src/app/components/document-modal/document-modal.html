<div class="modal-backdrop" (click)="closeModal()">
  <section
    class="document-modal"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title"
    (click)="$event.stopPropagation()"
  >
    <header class="modal-header">
      <h2>{{ title }}</h2>

      <button
        class="close-button"
        type="button"
        aria-label="Close"
        (click)="closeModal()"
      >
        ×
      </button>
    </header>

    <div class="modal-content">
      <ng-content></ng-content>
    </div>
  </section>
</div>
